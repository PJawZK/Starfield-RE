name: sfprobe tests

on:
  push:
    paths:
      - 'tools/sfprobe/**'
      - '.github/workflows/sfprobe-tests.yml'
  pull_request:
    paths:
      - 'tools/sfprobe/**'
      - '.github/workflows/sfprobe-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sfprobe synthetic parser tests
        run: python tools/sfprobe/test_sfprobe.py -v
